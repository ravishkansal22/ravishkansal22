<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="100%" height="100%" fill="#0D1117" rx="10" stroke="#30363D" stroke-width="1.5"/>
  <rect x="6" y="6" width="868" height="208" rx="8" fill="url(#bgGrad)" stroke="#1F6FEB" stroke-width="1" opacity="0.3"/>

  <!-- Top Bar -->
  <g transform="translate(24, 28)">
    <text x="0" y="0" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.5">&gt; experience.current</text>
    
    <!-- Status Badge -->
    <rect x="710" y="-14" width="122" height="22" rx="11" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <circle cx="722" cy="-3" r="4" fill="#7EE787"/>
    <text x="732" y="1" fill="#7EE787" font-family="ui-monospace, monospace" font-size="10" font-weight="700">ACTIVE</text>
    <text x="778" y="1" fill="#8B949E" font-family="ui-monospace, monospace" font-size="10">| 2026</text>
  </g>

  <!-- Title & Company -->
  <g transform="translate(24, 62)">
    <text x="0" y="0" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">SDET Intern</text>
    <text x="105" y="0" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">&mdash;</text>
    <text x="125" y="0" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600">Autoload AI Systems Pvt. Ltd.</text>
  </g>

  <!-- Scope / Domain -->
  <g transform="translate(24, 86)">
    <text x="0" y="0" fill="#8B949E" font-family="ui-monospace, monospace" font-size="11" font-weight="600">DOMAIN:</text>
    <text x="58" y="0" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">Software Engineering &amp; Quality Infrastructure</text>
    <text x="360" y="0" fill="#30363D" font-size="12">&bull;</text>
    <text x="375" y="0" fill="#8B949E" font-family="ui-monospace, monospace" font-size="11" font-weight="600">FOCUS:</text>
    <text x="425" y="0" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">System Reliability &amp; Automated Validation</text>
  </g>

  <!-- Bullet Points -->
  <g transform="translate(24, 116)">
    <!-- Bullet 1 -->
    <rect x="0" y="-7" width="4" height="4" fill="#58A6FF" rx="1"/>
    <text x="14" y="-2" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Developing automated validation pipelines and robust test harnesses for AI model services.</text>

    <!-- Bullet 2 -->
    <rect x="0" y="15" width="4" height="4" fill="#58A6FF" rx="1"/>
    <text x="14" y="20" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Conducting stress testing, latency benchmarking, and performance regression analysis across services.</text>

    <!-- Bullet 3 -->
    <rect x="0" y="37" width="4" height="4" fill="#58A6FF" rx="1"/>
    <text x="14" y="42" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Implementing CI/CD quality validation gates to ensure system scalability, test coverage, and API contracts.</text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(24, 185)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="68" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="34" y="14.5" fill="#58A6FF" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">PyTest</text>

    <!-- Pill 2 -->
    <rect x="76" y="0" width="68" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="110" y="14.5" fill="#7EE787" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">Python</text>

    <!-- Pill 3 -->
    <rect x="152" y="0" width="72" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="188" y="14.5" fill="#58A6FF" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">FastAPI</text>

    <!-- Pill 4 -->
    <rect x="232" y="0" width="60" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="262" y="14.5" fill="#D29922" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">CI/CD</text>

    <!-- Pill 5 -->
    <rect x="300" y="0" width="112" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="356" y="14.5" fill="#C9D1D9" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">Benchmarking</text>

    <!-- Pill 6 -->
    <rect x="420" y="0" width="145" height="22" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="492.5" y="14.5" fill="#C9D1D9" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" text-anchor="middle">Reliability Engineering</text>
  </g>
</svg>
